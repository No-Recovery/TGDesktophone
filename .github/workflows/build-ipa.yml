name: Build unsigned IPA

# Manual only: one run takes roughly 60-90 minutes on a macOS runner.
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle ID of the built app (reverse-DNS). Change it if your eSign certificate is tied to a specific App ID."
        required: true
        default: "com.dassd.tglandscape"
        type: string

permissions:
  contents: read

jobs:
  build:
    # Xcode 27 public preview image: macOS 27.0.1 with Xcode 27.1.
    # Telegram 13.1.2 declares exactly Xcode 27.1 in versions.json.
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      UPSTREAM_REPO: https://github.com/TelegramMessenger/Telegram-iOS.git
      UPSTREAM_REF: 279f89e4d4f63f17227bf877dc3d8990f22ecd58
      APP_BUNDLE_ID: ${{ inputs.bundle_id }}
      APP_URL_SCHEME: tg
    steps:
      - name: Checkout build scaffold
        uses: actions/checkout@v4

      - name: Check Telegram API secrets
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          set -euo pipefail
          if [[ -z "${TG_API_ID:-}" || -z "${TG_API_HASH:-}" ]]; then
            echo "::error::Add repository secrets TG_API_ID and TG_API_HASH (my.telegram.org -> API development tools), then re-run."
            exit 1
          fi

      - name: Fetch Telegram-iOS at the pinned commit
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/telegram-ios"
          rm -rf "$SRC"
          git init -q "$SRC"
          cd "$SRC"
          git remote add origin "$UPSTREAM_REPO"
          git fetch --depth 1 -q origin "$UPSTREAM_REF"
          git checkout -q --detach FETCH_HEAD
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1 --jobs 8
          git rev-parse HEAD

      - name: Select upstream Xcode
        run: |
          set -euo pipefail
          WANT="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["xcode"])' "$RUNNER_TEMP/telegram-ios/versions.json")"
          echo "upstream wants Xcode $WANT"
          if [[ -d "/Applications/Xcode_${WANT}.app" ]]; then
            sudo xcode-select -s "/Applications/Xcode_${WANT}.app/Contents/Developer"
          fi
          xcodebuild -version
          GOT="$(xcodebuild -version | awk '/^Xcode/{print $2}')"
          if [[ "$GOT" != "$WANT" && "$GOT" != "$WANT".* ]]; then
            echo "::error::Xcode $WANT is required, runner has $GOT"
            exit 1
          fi

      - name: Apply landscape patch
        run: bash scripts/apply_patch.sh "$RUNNER_TEMP/telegram-ios"

      - name: Create build configuration
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          set -euo pipefail
          python3 scripts/make_config.py \
            --upstream "$RUNNER_TEMP/telegram-ios" \
            --output "$RUNNER_TEMP/build-config.json"

      - name: Enable unsigned device build
        run: |
          set -euo pipefail
          python3 scripts/enable_unsigned_build.py \
            --make-script "$RUNNER_TEMP/telegram-ios/build-system/Make/Make.py" \
            --rules-apple-root "$RUNNER_TEMP/telegram-ios/build-system/bazel-rules/rules_apple"

      - name: Restore Bazel cache
        uses: actions/cache@v4
        with:
          path: ~/telegram-bazel-cache
          key: bazel-${{ runner.os }}-${{ env.UPSTREAM_REF }}-v1

      - name: Build unsigned device app
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/telegram-ios"
          mkdir -p "$RUNNER_TEMP/out"
          python3 -u build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath="$RUNNER_TEMP/build-config.json" \
            --xcodeManagedCodesigning \
            --disableProvisioningProfiles \
            --configuration=release_arm64 \
            --buildNumber="$GITHUB_RUN_NUMBER" \
            --outputBuildArtifactsPath="$RUNNER_TEMP/out"
          ls -lh "$RUNNER_TEMP/out"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          python3 scripts/package_ipa.py \
            --input "$RUNNER_TEMP/out/Telegram.ipa" \
            --output "$GITHUB_WORKSPACE/artifacts/telegram-landscape-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: telegram-landscape-unsigned
          path: artifacts/telegram-landscape-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: success()
        run: |
          {
            echo "## Unsigned IPA is ready"
            echo ""
            echo "- Upstream: $UPSTREAM_REF (Telegram 13.1.2)"
            echo "- Bundle ID: $APP_BUNDLE_ID"
            echo "- Artifact: **telegram-landscape-unsigned**"
            echo ""
            echo "Download the artifact, unzip it and sign the .ipa with eSign."
          } >> "$GITHUB_STEP_SUMMARY"
