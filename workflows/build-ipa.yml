name: Build Telegram IPA (desktop landscape mod)

on:
  workflow_dispatch:

jobs:
  build:
    # Telegram needs a very new Xcode (see versions.json in the upstream repo).
    # If this runner label has no suitable Xcode, change it to a newer macOS runner.
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Checkout mod files
        uses: actions/checkout@v4

      - name: Clone upstream Telegram-iOS with submodules
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          git clone --recursive -j8 https://github.com/TelegramMessenger/Telegram-iOS.git /Users/Shared/telegram-ios
          cd /Users/Shared/telegram-ios
          git log -1 --format='upstream commit: %H'

      - name: Apply the mod
        run: |
          set -x
          cd /Users/Shared/telegram-ios
          if git apply --check "$GITHUB_WORKSPACE/tg-desktop-landscape.patch"; then
            git apply "$GITHUB_WORKSPACE/tg-desktop-landscape.patch"
            echo "Patch applied cleanly."
          else
            echo "::warning::Patch does not apply cleanly to current upstream; overwriting the 4 changed files instead."
            cp -R "$GITHUB_WORKSPACE/changes/submodules/." submodules/
          fi
          git status --short

      - name: Select Xcode
        run: |
          set -x
          cd /Users/Shared/telegram-ios
          WANT=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          echo "Upstream wants Xcode $WANT"
          ls /Applications | grep -i xcode || true
          if [ -d "/Applications/Xcode_$WANT.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_$WANT.app/Contents/Developer"
            echo "XCODE_OVERRIDE=" >> $GITHUB_ENV
          else
            LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
            echo "::warning::Xcode $WANT not found on this runner, using $LATEST"
            sudo xcode-select -s "$LATEST/Contents/Developer"
            echo "XCODE_OVERRIDE=--overrideXcodeVersion" >> $GITHUB_ENV
          fi
          xcodebuild -version
          df -h /

      - name: Build the IPA
        run: |
          set -x
          cd /Users/Shared/telegram-ios
          BUILD_NUMBER=$((100000 + GITHUB_RUN_NUMBER))
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="/private/var/tmp/_bazel_containerhost" \
            build \
            $XCODE_OVERRIDE \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"
          mkdir -p build/artifacts
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
            cp "$f" build/artifacts/
          done
          ls -la build/artifacts

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-desktop-landscape-ipa
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
          if-no-files-found: error
